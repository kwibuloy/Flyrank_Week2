# The whole stack: the Task API and its Postgres database.
#   docker compose up --build
# Values like ${POSTGRES_USER} come from the .env file next to this one.
name: tasks-api

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Only reachable from this machine, e.g. for psql or a database viewer.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # The data lives in a named volume, so it survives container restarts and removal.
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is empty: creates the table and example tasks.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  app:
    build: .
    environment:
      # Inside compose the database host is the service name "db", not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    name: tasks-pgdata
